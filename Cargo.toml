[package]
name = "poem-template"
version = "0.1.0"
edition = "2024"
license = "0BSD"

[dependencies]
color-eyre = "0.6.5"
log = "0.4.34"
poem = "3.1.12"
poem-openapi = { version = "5.1.16", features = ["swagger-ui"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "tracing"] }
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = "0.3.23"
